<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aqua Cube">
<link rel="manifest" href="./manifest.webmanifest">
<title>Aqua Cube</title>
<style>
:root{--bg:#F7FAFC;--surface:rgba(255,255,255,.76);--text:#172027;--secondary:#73808A;--divider:#DDE5EA;--primary:#72C9F4;--primaryDark:#123044;--shadow:0 18px 40px rgba(18,48,68,.09)}
:root[data-theme=dark]{--bg:#0E1418;--surface:rgba(25,34,40,.82);--text:#F3F8FA;--secondary:#9BAAB3;--divider:#2B3941;--primaryDark:#EAF8FF;--shadow:0 18px 40px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{border:0;-webkit-tap-highlight-color:transparent;cursor:pointer}#app{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.screen{width:min(100%,620px);min-height:100dvh;margin:auto;padding:24px 24px 112px}.top{display:flex;justify-content:space-between}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--secondary)}h1{font-size:32px;line-height:1.1;margin:3px 0 5px;letter-spacing:-.7px}.date{margin:0;color:var(--secondary);font-size:15px}.gear{width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-size:19px}.today{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:28px}.cube{position:relative;width:min(70vw,250px);aspect-ratio:1;overflow:hidden;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(220,241,250,.2));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(114,201,244,.13),0 28px 60px rgba(60,130,165,.15)}.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(114,201,244,.66),rgba(114,201,244,.92));transition:height .6s cubic-bezier(.22,.8,.24,1)}.surface{position:absolute;top:-8px;left:-8%;width:116%;height:18px;border-radius:50%;background:rgba(255,255,255,.32);filter:blur(2px);animation:float 3.5s ease-in-out infinite}.highlight{position:absolute;width:24%;height:70%;left:15%;top:15%;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(10px)}.glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.52),transparent 35%,rgba(255,255,255,.16));pointer-events:none}.edge{position:absolute;inset:8px;border:1px solid rgba(255,255,255,.48);border-radius:23px;pointer-events:none}.shine{position:absolute;inset:10% 68% 14% 11%;border-radius:50%;background:rgba(255,255,255,.26);filter:blur(14px);transform:rotate(8deg);pointer-events:none}.summary{display:flex;flex-direction:column;align-items:center;margin-top:24px}.summary strong{font-size:30px;letter-spacing:-.6px}.summary span,.summary small{color:var(--secondary)}.summary span{margin-top:3px}.summary small{margin-top:10px}.add{position:relative;display:flex;align-items:stretch;margin-top:28px}.primary{min-width:200px;height:54px;padding:0 48px 0 24px;border-radius:999px;background:var(--primary);color:var(--primaryDark);font-weight:700;box-shadow:0 12px 28px rgba(114,201,244,.25);transition:transform .16s}.primary:active{transform:scale(.97)}.toggle{width:44px;margin-left:-48px;background:transparent;color:var(--primaryDark);font-size:20px;z-index:2}.menu{position:absolute;z-index:10;top:62px;left:0;right:0;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--divider);border-radius:20px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.menu button{min-height:44px;border-radius:14px;background:transparent;color:var(--text)}.menu .selected{background:rgba(114,201,244,.18);font-weight:700}.menu .other{grid-column:1/-1;color:var(--secondary)}.hidden{display:none}.timeline{width:100%;margin-top:44px}.line{height:2px;background:var(--divider)}.dot{width:8px;height:8px;margin-top:-5px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 5px rgba(114,201,244,.13)}.labels{display:flex;justify-content:space-between;margin-top:10px;color:var(--secondary);font-size:13px}.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),430px);height:68px;display:grid;grid-template-columns:repeat(3,1fr);padding:7px;border:1px solid var(--divider);border-radius:24px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:var(--shadow);z-index:20}.nav button{border-radius:18px;background:transparent;color:var(--secondary);font-size:13px}.nav .active{background:rgba(114,201,244,.16);color:var(--text);font-weight:700}.card{margin-top:16px;padding:20px;border:1px solid var(--divider);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.list{display:grid;gap:10px}.card b{display:block;margin-bottom:8px}.settings{display:grid;gap:18px}.settings label{display:grid;gap:8px;color:var(--secondary);font-size:14px}.settings input,.settings select{width:100%;height:48px;border:1px solid var(--divider);border-radius:14px;padding:0 14px;color:var(--text);background:var(--bg)}.full{width:100%;padding:0}.back{margin-top:16px;height:44px;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--text);border:1px solid var(--divider)}
@keyframes float{0%,100%{transform:translateX(-1%) scaleY(1)}50%{transform:translateX(1%) scaleY(.82)}}
</style>
</head>
<body><div id="app"></div>
<script>
const DB='aqua-cube',KEY='profile',ENTRY='entries';
const defaults={goal:2000,volume:250,theme:'system'};
let profile={...defaults},entries=[],tab='today';
const presets=[100,150,200,250,330,500];
const $=s=>document.querySelector(s);
const ml=n=>new Intl.NumberFormat('ru-RU').format(n);
function todayKey(){return new Date().toISOString().slice(0,10)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(KEY))d.createObjectStore(KEY,{keyPath:'id'});if(!d.objectStoreNames.contains(ENTRY))d.createObjectStore(ENTRY,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){let d=await openDB();let p=await new Promise((res,rej)=>{let r=d.transaction(KEY).objectStore(KEY).get('default');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});profile=p?{...defaults,...p}:profile;entries=await new Promise((res,rej)=>{let r=d.transaction(ENTRY).objectStore(ENTRY).getAll();r.onsuccess=()=>res(r.result.filter(x=>x.date.slice(0,10)===todayKey()));r.onerror=()=>rej(r.error)});applyTheme()}
async function saveProfile(){let d=await openDB();return new Promise((res,rej)=>{let t=d.transaction(KEY,'readwrite');t.objectStore(KEY).put({id:'default',...profile});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function addWater(n){let d=await openDB();let e={id:(crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)),amount:n,date:new Date().toISOString()};await new Promise((res,rej)=>{let t=d.transaction(ENTRY,'readwrite');t.objectStore(ENTRY).add(e);t.oncomplete=res;t.onerror=()=>rej(t.error)});entries.push(e);render()}
function applyTheme(){let t=profile.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):profile.theme;document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0E1418':'#F7FAFC'}
function render(){let total=entries.reduce((s,e)=>s+e.amount,0),pct=Math.round(total/Math.max(profile.goal,1)*100),p=Math.min(total/Math.max(profile.goal,1),1)*100;let date=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let body='';
if(tab==='today')body=`<section class="screen"><div class="top"><div><div class="eyebrow">AQUA CUBE</div><h1>Сегодня</h1><p class="date">${date}</p></div><button class="gear" id="settings">⚙</button></div><main class="today"><div class="cube"><div class="water" style="height:${p}%"><div class="surface"></div><div class="highlight"></div></div><div class="glass"></div><div class="edge"></div><div class="shine"></div></div><div class="summary"><strong>${ml(total)} мл</strong><span>из ${ml(profile.goal)} мл</span><small>${total<profile.goal?'Осталось '+ml(profile.goal-total)+' мл':'Цель достигнута'}</small></div><div class="add"><button class="primary" id="add">+ ${ml(profile.volume)} мл</button><button class="toggle" id="toggle">⌄</button><div class="menu hidden" id="menu">${presets.map(v=>`<button class="${v===profile.volume?'selected':''}" data-v="${v}">${v} мл</button>`).join('')}<button class="other" id="other">Другой объём</button></div></div><div class="timeline"><div class="line"></div><div class="dot"></div><div class="labels"><span>Сегодня</span><span>${pct}%</span></div></div></main><nav class="nav"><button class="active" data-tab="today">Сегодня</button><button data-tab="history">История</button><button data-tab="tools">Инструменты</button></nav></section>`;
else if(tab==='history')body=`<section class="screen"><div class="eyebrow">AQUA CUBE</div><h1>История</h1><p class="date">Последние 7 дней</p><div class="card"><b>Сегодня</b><span>${ml(total)} мл из ${ml(profile.goal)} мл</span></div><div class="card"><b>Следующий этап</b><span>Здесь появятся недельный график, среднее значение и детали каждого дня.</span></div><nav class="nav"><button data-tab="today">Сегодня</button><button class="active" data-tab="history">История</button><button data-tab="tools">Инструменты</button></nav></section>`;
else if(tab==='tools')body=`<section class="screen"><div class="eyebrow">AQUA CUBE</div><h1>Инструменты</h1><div class="list"><div class="card"><b>Рассчитать цель</b><span>Ориентир по весу.</span></div><div class="card"><b>Конвертер</b><span>мл, л, oz и стаканы.</span></div><div class="card"><b>Распределить воду</b><span>Спокойный план на день.</span></div><div class="card"><b>Знания</b><span>Проверенные материалы.</span></div><div class="card"><b>Мои объёмы</b><span>Собственные бутылки и стаканы.</span></div></div><nav class="nav"><button data-tab="today">Сегодня</button><button data-tab="history">История</button><button class="active" data-tab="tools">Инструменты</button></nav></section>`;
else body=`<section class="screen"><div class="eyebrow">AQUA CUBE</div><h1>Настройки</h1><div class="card settings"><label>Дневная цель<input id="goal" type="number" min="250" max="10000" step="50" value="${profile.goal}"></label><label>Объём по умолчанию<select id="volume">${presets.map(v=>`<option value="${v}" ${v===profile.volume?'selected':''}>${v} мл</option>`).join('')}</select></label><label>Тема<select id="theme"><option value="system" ${profile.theme==='system'?'selected':''}>Системная</option><option value="light" ${profile.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${profile.theme==='dark'?'selected':''}>Тёмная</option></select></label><button class="primary full" id="save">Сохранить</button></div><div class="card"><b>Aqua Cube</b><span>Локальное приложение без аккаунта и Apple Health.</span></div><button class="back" id="back">Назад</button></section>`;
$('#app').innerHTML=body;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#settings')?.addEventListener('click',()=>{tab='settings';render()});$('#toggle')?.addEventListener('click',()=>$('#menu').classList.toggle('hidden'));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{profile.volume=+b.dataset.v;await saveProfile();render()});$('#add')?.addEventListener('click',()=>addWater(profile.volume));$('#other')?.addEventListener('click',async()=>{let v=Number(prompt('Введите объём в мл (1–5000):'));if(v>=1&&v<=5000){profile.volume=v;await saveProfile();render()}});$('#save')?.addEventListener('click',async()=>{profile.goal=Number($('#goal').value)||2000;profile.volume=Number($('#volume').value)||250;profile.theme=$('#theme').value;await saveProfile();applyTheme();tab='today';render()});$('#back')?.addEventListener('click',()=>{tab='today';render()})}
async function boot(){
  try { await load(); }
  catch (error) {
    console.error('Aqua Cube storage error:', error);
    // The UI must still work if IndexedDB is temporarily unavailable.
    profile = {...defaults};
    entries = [];
    applyTheme();
  }
  render();
}
boot();
// Service Worker is intentionally registered only after the UI has rendered.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => console.warn('Service Worker:', error));
  });
}
</script><noscript><div style="padding:32px;font-family:system-ui">Для Aqua Cube нужен JavaScript.</div></noscript></body></html>
