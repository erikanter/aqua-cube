<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{border:0;-webkit-tap-highlight-color:transparent;cursor:pointer}#app{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.screen{width:min(100%,620px);min-height:100dvh;margin:auto;padding:24px 24px 112px}.top{display:flex;justify-content:space-between}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--secondary)}h1{font-size:32px;line-height:1.1;margin:3px 0 5px;letter-spacing:-.7px}.date{margin:0;color:var(--secondary);font-size:15px}.gear{width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-size:19px}.today{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:28px}.cube{position:relative;width:min(70vw,250px);aspect-ratio:1;overflow:hidden;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(220,241,250,.2));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(114,201,244,.13),0 28px 60px rgba(60,130,165,.15)}.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(114,201,244,.66),rgba(114,201,244,.92));transition:height .6s cubic-bezier(.22,.8,.24,1)}.surface{position:absolute;top:-8px;left:-8%;width:116%;height:18px;border-radius:50%;background:rgba(255,255,255,.32);filter:blur(2px);animation:float 3.5s ease-in-out infinite}.highlight{position:absolute;width:24%;height:70%;left:15%;top:15%;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(10px)}.glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.52),transparent 35%,rgba(255,255,255,.16));pointer-events:none}.edge{position:absolute;inset:8px;border:1px solid rgba(255,255,255,.48);border-radius:23px;pointer-events:none}.shine{position:absolute;inset:10% 68% 14% 11%;border-radius:50%;background:rgba(255,255,255,.26);filter:blur(14px);transform:rotate(8deg);pointer-events:none}.summary{display:flex;flex-direction:column;align-items:center;margin-top:24px}.summary strong{font-size:30px;letter-spacing:-.6px}.summary span,.summary small{color:var(--secondary)}.summary span{margin-top:3px}.summary small{margin-top:10px}.add{position:relative;display:flex;align-items:stretch;margin-top:28px}.primary{min-width:200px;height:54px;padding:0 48px 0 24px;border-radius:999px;background:var(--primary);color:var(--primaryDark);font-weight:700;box-shadow:0 12px 28px rgba(114,201,244,.25);transition:transform .16s}.primary:active{transform:scale(.97)}.toggle{width:44px;margin-left:-48px;background:transparent;color:var(--primaryDark);font-size:20px;z-index:2}.menu{position:absolute;z-index:10;top:62px;left:0;right:0;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--divider);border-radius:20px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.menu button{min-height:44px;border-radius:14px;background:transparent;color:var(--text)}.menu .selected{background:rgba(114,201,244,.18);font-weight:700}.menu .other{grid-column:1/-1;color:var(--secondary)}.hidden{display:none}.timeline{width:100%;margin-top:44px}.line{height:2px;background:var(--divider)}.dot{width:8px;height:8px;margin-top:-5px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 5px rgba(114,201,244,.13)}.labels{display:flex;justify-content:space-between;margin-top:10px;color:var(--secondary);font-size:13px}.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),430px);height:68px;display:grid;grid-template-columns:repeat(3,1fr);padding:7px;border:1px solid var(--divider);border-radius:24px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:var(--shadow);z-index:20}.nav button{border-radius:18px;background:transparent;color:var(--secondary);font-size:13px}.nav .active{background:rgba(114,201,244,.16);color:var(--text);font-weight:700}.card{margin-top:16px;padding:20px;border:1px solid var(--divider);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.list{display:grid;gap:10px}.card b{display:block;margin-bottom:8px}.settings{display:grid;gap:18px}.settings label{display:grid;gap:8px;color:var(--secondary);font-size:14px}.settings input,.settings select{width:100%;height:48px;border:1px solid var(--divider);border-radius:14px;padding:0 14px;color:var(--text);background:var(--bg)}.full{width:100%;padding:0}.back{margin-top:16px;height:44px;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--text);border:1px solid var(--divider)}
.tool-card{width:100%;display:block;text-align:left;padding:20px;border:1px solid var(--divider);border-radius:24px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tool-card b{display:block;font-size:17px;margin-bottom:6px}.tool-card span{display:block;color:var(--secondary);font-size:14px;line-height:1.4}

.tool-screen{padding-top:8px}.tool-screen h1{margin-top:6px}.tool-intro{color:var(--secondary);font-size:16px;line-height:1.45;margin:10px 0 22px}
.form-card{display:grid;gap:14px}.form-card label{display:grid;gap:8px;color:var(--secondary);font-size:14px}.form-card input{width:100%;height:54px;border:1px solid var(--divider);border-radius:16px;padding:0 16px;color:var(--text);background:var(--bg);font-size:18px;outline:none}
.form-card input:focus{border-color:rgba(114,201,244,.8);box-shadow:0 0 0 3px rgba(114,201,244,.12)}

.note{font-size:12px;line-height:1.45;color:var(--secondary);margin:14px 2px 0}

.gear svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.stat-card{padding:18px;border:1px solid var(--divider);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}.stat-card span,.stat-card small{display:block;color:var(--secondary);font-size:13px}.stat-card strong{display:block;margin:8px 0 2px;font-size:23px;letter-spacing:-.4px}.chart-card{margin-top:12px}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title span{font-size:12px;color:var(--secondary)}.chart{height:190px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;margin-top:18px}.bar-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;background:transparent;color:var(--secondary);padding:0}.bar-value{font-size:10px;height:18px}.bar-track{height:135px;width:24px;border-radius:999px;background:rgba(114,201,244,.09);display:flex;align-items:end;overflow:hidden}.bar-track i{display:block;width:100%;border-radius:999px;background:linear-gradient(180deg,rgba(114,201,244,.62),rgba(114,201,244,.95));transition:height .35s ease}.bar-day{font-size:11px;margin-top:7px;text-transform:capitalize}.bar-wrap.today-bar .bar-track{box-shadow:0 0 0 2px rgba(114,201,244,.16)}.bar-wrap.chosen .bar-track{box-shadow:0 0 0 3px rgba(114,201,244,.25)}.goal-caption{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:11px;color:var(--secondary)}.day-list{display:grid;gap:8px;margin-top:12px}.day-row{width:100%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;text-align:left;padding:15px 16px;border:1px solid var(--divider);border-radius:18px;background:var(--surface);color:var(--text)}.day-row strong{font-size:14px}.day-info b,.day-info small{display:block}.day-info small{margin-top:4px;color:var(--secondary);font-size:12px}.today-row{border-color:rgba(114,201,244,.38)}.chevron{font-size:24px;color:var(--secondary);line-height:1}.detail{margin-top:12px}.detail-head{display:flex;justify-content:space-between;align-items:start}.detail-head b,.detail-head span{display:block}.detail-head span{margin-top:5px;color:var(--secondary);font-size:13px}.close-detail{width:30px;height:30px;border-radius:50%;background:rgba(114,201,244,.12);color:var(--text);font-size:20px;line-height:1}.detail-progress{height:7px;background:var(--divider);border-radius:999px;overflow:hidden;margin-top:16px}.detail-progress div{height:100%;background:var(--primary);border-radius:inherit}.entry-list{margin-top:10px}.entry-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--divider);font-size:14px}.entry-row:last-child{border-bottom:0}.entry-row span,.empty{color:var(--secondary)}

@keyframes float{0%,100%{transform:translateX(-1%) scaleY(1)}50%{transform:translateX(1%) scaleY(.82)}}

<body><div id="app"></div>
<script>
const DB='aqua-cube',KEY='profile',ENTRY='entries';
const defaults={goal:2000,volume:250,theme:'system'};
let profile={...defaults},entries=[],allEntries=[],tab='today',selectedHistoryDate=null,toolView=null;
const presets=[100,150,200,250,330,500];
const $=s=>document.querySelector(s);
const ml=n=>new Intl.NumberFormat('ru-RU').format(n);
function todayKey(){return new Date().toISOString().slice(0,10)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(KEY))d.createObjectStore(KEY,{keyPath:'id'});if(!d.objectStoreNames.contains(ENTRY))d.createObjectStore(ENTRY,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){let d=await openDB();let p=await new Promise((res,rej)=>{let r=d.transaction(KEY).objectStore(KEY).get('default');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});profile=p?{...defaults,...p}:profile;allEntries=await new Promise((res,rej)=>{let r=d.transaction(ENTRY).objectStore(ENTRY).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});entries=allEntries.filter(x=>x.date.slice(0,10)===todayKey());applyTheme()}
async function saveProfile(){let d=await openDB();return new Promise((res,rej)=>{let t=d.transaction(KEY,'readwrite');t.objectStore(KEY).put({id:'default',...profile});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function addWater(n){let d=await openDB();let e={id:(crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)),amount:n,date:new Date().toISOString()};await new Promise((res,rej)=>{let t=d.transaction(ENTRY,'readwrite');t.objectStore(ENTRY).add(e);t.oncomplete=res;t.onerror=()=>rej(t.error)});entries.push(e);allEntries.push(e);render()}
function applyTheme(){let t=profile.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):profile.theme;document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0E1418':'#F7FAFC'}

function dateKey(date){return date.toISOString().slice(0,10)}
function localDateFromKey(key){
  const [y,m,d]=key.split('-').map(Number);
  return new Date(y,m-1,d);
}
function lastSevenDays(){
  const now=new Date(),days=[];
  now.setHours(12,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(now);
    d.setDate(now.getDate()-i);
    days.push(d);
  }
  return days;
}
function dayEntries(key){
  return allEntries.filter(e=>e.date.slice(0,10)===key).sort((a,b)=>a.date.localeCompare(b.date));
}
function dayTotal(key){return dayEntries(key).reduce((s,e)=>s+e.amount,0)}
function shortDay(d){return new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(d).replace('.','')}
function fullDay(d){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(d)}
function timeOf(iso){return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function historyView(){
  const days=lastSevenDays();
  const data=days.map(d=>({date:d,key:dateKey(d),total:dayTotal(dateKey(d))}));
  const avg=Math.round(data.reduce((s,x)=>s+x.total,0)/7);
  const avgPct=Math.round(avg/Math.max(profile.goal,1)*100);
  const reached=data.filter(x=>x.total>=profile.goal).length;
  const max=Math.max(profile.goal,...data.map(x=>x.total),1);
  const selected=selectedHistoryDate ? data.find(x=>x.key===selectedHistoryDate) : null;

  const detail=selected ? `
    <div class="detail card">
      <div class="detail-head">
        <div><b>${fullDay(selected.date)}</b><span>${ml(selected.total)} мл из ${ml(profile.goal)} мл</span></div>
        <button class="close-detail" id="close-detail" aria-label="Закрыть">×</button>
      </div>
      <div class="detail-progress"><div style="width:${Math.min(selected.total/Math.max(profile.goal,1),1)*100}%"></div></div>
      <div class="entry-list">
        ${dayEntries(selected.key).length ? dayEntries(selected.key).map(e=>`<div class="entry-row"><span>${timeOf(e.date)}</span><strong>${ml(e.amount)} мл</strong></div>`).join('') : `<div class="empty">В этот день записей нет.</div>`}
      </div>
    </div>` : '';

  return `
    <section class="screen">
      <div class="eyebrow">AQUA CUBE</div>
      <h1>История</h1>
      <p class="date">Последние 7 дней</p>

      <div class="stats-grid">
        <div class="stat-card"><span>Среднее</span><strong>${ml(avg)} мл</strong><small>в день</small></div>
        <div class="stat-card"><span>Средняя цель</span><strong>${avgPct}%</strong><small>от цели</small></div>
      </div>

      <div class="card chart-card">
        <div class="section-title"><b>Последние 7 дней</b><span>${reached} из 7 дней</span></div>
        <div class="chart">
          ${data.map(x=>{
            const height=Math.max(5,Math.round(x.total/max*100));
            const isToday=x.key===todayKey();
            const pct=Math.round(x.total/Math.max(profile.goal,1)*100);
            return `<button class="bar-wrap ${isToday?'today-bar':''} ${x.key===selectedHistoryDate?'chosen':''}" data-history-date="${x.key}">
              <span class="bar-value">${pct}%</span>
              <span class="bar-track"><i style="height:${height}%"></i></span>
              <span class="bar-day">${shortDay(x.date)}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="goal-caption"><span>Цель: ${ml(profile.goal)} мл</span><span>${reached} из 7 дней — цель достигнута</span></div>
      </div>

      ${detail}

      <div class="day-list">
        ${data.slice().reverse().map(x=>`
          <button class="day-row ${x.key===todayKey()?'today-row':''}" data-history-date="${x.key}">
            <span class="day-info"><b>${x.key===todayKey()?'Сегодня':fullDay(x.date)}</b><small>${x.total>=profile.goal?'Цель достигнута':`Осталось ${ml(Math.max(profile.goal-x.total,0))} мл`}</small></span>
            <strong>${ml(x.total)} мл</strong><span class="chevron">›</span>
          </button>`).join('')}
      </div>

      <nav class="nav"><button data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button class="active" data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav>

function toolsView(){
  const tools = [
    ['DROP','Рассчитать цель','Ориентир по весу.','goal-calculator'], ['CONVERT','Конвертер','мл, л, oz и стаканы.','converter'], ['CLOCK','Распределить воду','Спокойный план на день.','distribution'], ['BOOK','Знания','Проверенные материалы.','knowledge'], ['BOTTLE','Мои объёмы','Собственные бутылки и стаканы.','volumes']
  ];
  return `
    <section class="screen">
      <div class="eyebrow">AQUA CUBE</div>
      <h1>Инструменты</h1>
      <p class="tool-intro">Небольшие инструменты, которые помогают настроить Aqua Cube под тебя.</p>
      <div class="list">
        ${tools.map(t=>`
          <button class="tool-card" data-tool="${t[3]}">
            <div class="tool-icon">${({'DROP':ICON.drop,'CONVERT':ICON.convert,'CLOCK':ICON.clock,'BOOK':ICON.book,'BOTTLE':ICON.bottle}[t[0]])}</div>
            <b>${t[1]}</b>
            <span>${t[2]}</span>
          </button>`).join('')}
      </div>
      <nav class="nav"><button data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button class="active" data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav>
    </section>`;
}

function goalCalculatorView(){
  return `
    <section class="screen tool-screen">
      <div class="eyebrow">AQUA CUBE</div>
      <h1>Рассчитать цель</h1>
      <p class="tool-intro">Рассчитаем ориентировочную дневную цель по весу.</p>

      <div class="card form-card">
        <label>Вес
          <input id="weight" type="number" inputmode="decimal" min="1" max="300" step="0.1" placeholder="Например, 70">
        </label>
        <button class="primary full" id="calculate-goal">Рассчитать</button>
      </div>

      <div id="goal-result"></div>

      <p class="note">Формула Aqua Cube: вес × 30 мл. Результат округляется до ближайших 50 мл. Это ориентир для настройки приложения, а не медицинское назначение.</p>
      <button class="tool-back" id="tools-back">Назад к инструментам</button>
    </section>`;
}

function renderGoalResult(value){
  const result=$('#goal-result');
  if(!result) return;
  if(!value){result.innerHTML='';return}
  result.innerHTML=`
    <div class="card calc-result">
      <small>Ориентировочная цель</small>
      <strong>${ml(value)} мл</strong>
      <small>в день</small>
      <button class="primary full" id="save-calculated-goal" style="margin-top:16px">Сохранить как цель</button>
    </div>`;
  $('#save-calculated-goal').onclick=async()=>{
    profile.goal=value;
    await saveProfile();
    tab='today';
    toolView=null;
    render();
  };
}

function render(){let total=entries.reduce((s,e)=>s+e.amount,0),pct=Math.round(total/Math.max(profile.goal,1)*100),p=Math.min(total/Math.max(profile.goal,1),1)*100;let date=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let body='';
if(tab==='today')body=`<section class="screen"><div class="top"><div><div class="eyebrow">AQUA CUBE</div><h1>Сегодня</h1><p class="date">${date}</p></div><button class="gear-button" id="settings" aria-label="Настройки" title="Настройки">${ICON.gear}</button></div><main class="today"><div class="cube"><div class="water" style="height:${p}%"><div class="surface"></div><div class="highlight"></div></div><div class="glass"></div><div class="edge"></div><div class="shine"></div></div><div class="summary"><strong>${ml(total)} мл</strong><span>из ${ml(profile.goal)} мл</span><small>${total<profile.goal?'Осталось '+ml(profile.goal-total)+' мл':'Цель достигнута'}</small></div><div class="add"><button class="primary" id="add">+ ${ml(profile.volume)} мл</button><button class="toggle" id="toggle">⌄</button><div class="menu hidden" id="menu">${presets.map(v=>`<button class="${v===profile.volume?'selected':''}" data-v="${v}">${v} мл</button>`).join('')}<button class="other" id="other">Другой объём</button></div></div><div class="timeline"><div class="line"></div><div class="dot"></div><div class="labels"><span>Сегодня</span><span>${pct}%</span></div></div></main><nav class="nav"><button class="active" data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav></section>`;
else if(tab==='history')body=historyView();
else if(tab==='tools')body=toolView==='goal-calculator'?goalCalculatorView():toolsView();
else body=`<section class="screen"><div class="eyebrow">AQUA CUBE</div><h1>Настройки</h1><div class="card settings"><label>Дневная цель<input id="goal" type="number" min="250" max="10000" step="50" value="${profile.goal}"></label><label>Объём по умолчанию<select id="volume">${presets.map(v=>`<option value="${v}" ${v===profile.volume?'selected':''}>${v} мл</option>`).join('')}</select></label><label>Тема<select id="theme"><option value="system" ${profile.theme==='system'?'selected':''}>Системная</option><option value="light" ${profile.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${profile.theme==='dark'?'selected':''}>Тёмная</option></select></label><button class="primary full" id="save">Сохранить</button></div><div class="card"><b>Aqua Cube</b><span>Локальное приложение без аккаунта и Apple Health.</span></div><button class="back" id="back">Назад</button></section>`;
$('#app').innerHTML=body;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedHistoryDate=null;toolView=null;render()});document.querySelectorAll('[data-history-date]').forEach(b=>b.onclick=()=>{selectedHistoryDate=b.dataset.historyDate;render()});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  if(b.dataset.tool==='goal-calculator'){toolView='goal-calculator';render();}
  else { alert('Этот инструмент добавим на следующем этапе.'); }
});
$('#calculate-goal')?.addEventListener('click',()=>{
  const weight=Number($('#weight').value);
  if(!weight || weight<1 || weight>300){ alert('Введите вес от 1 до 300 кг.'); return; }
  const calculated=Math.round((weight*30)/50)*50;
  renderGoalResult(calculated);
});
$('#tools-back')?.addEventListener('click',()=>{toolView=null;render()});
$('#close-detail')?.addEventListener('click',()=>{selectedHistoryDate=null;render()});$('#settings')?.addEventListener('click',()=>{tab='settings';render()});$('#toggle')?.addEventListener('click',()=>$('#menu').classList.toggle('hidden'));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{profile.volume=+b.dataset.v;await saveProfile();render()});$('#add')?.addEventListener('click',()=>addWater(profile.volume));$('#other')?.addEventListener('click',async()=>{let v=Number(prompt('Введите объём в мл (1–5000):'));if(v>=1&&v<=5000){profile.volume=v;await saveProfile();render()}});$('#save')?.addEventListener('click',async()=>{profile.goal=Number($('#goal').value)||2000;profile.volume=Number($('#volume').value)||250;profile.theme=$('#theme').value;await saveProfile();applyTheme();tab='today';render()});$('#back')?.addEventListener('click',()=>{tab='today';render()})}
async function boot(){
  try { await load(); }
  catch (error) {
    console.error('Aqua Cube storage error:', error);
    // The UI must still work if IndexedDB is temporarily unavailable.
    profile = {...defaults};
    entries = [];
    applyTheme();
  }
  render();
}
boot();
// Aqua Cube v0.8 — update-safe PWA registration.
// The Service Worker uses network-first navigation and versioned cache cleanup.
(async()=>{
  try{
    if(!('serviceWorker' in navigator)) return;
    const reg=await navigator.serviceWorker.register('./service-worker.js?v=8',{updateViaCache:'none'});
    await reg.update();
  }catch(e){console.warn('Aqua Cube PWA update:',e)}
})();
</script><noscript><div style="padding:32px;font-family:system-ui">Для Aqua Cube нужен JavaScript.</div></noscript></body></html>
