/* v0.10 — dynamic cube architecture: existing cube retained, baked water isolated */
.cube-stage{isolation:isolate}
.cube{position:relative;overflow:visible}
.cube-inner-glass{position:absolute;inset:0;z-index:1;pointer-events:none}
.cube-inner-glass::before,.cube-inner-glass::after{content:"";position:absolute;pointer-events:none}
.cube-inner-glass::before{left:12%;top:31%;width:51%;height:48%;border-radius:24% 18% 14% 12%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(175,225,244,.13) 48%,rgba(100,191,226,.11));box-shadow:inset 0 0 28px rgba(255,255,255,.18),inset 0 -24px 32px rgba(62,164,211,.08);transform:skewY(4deg);filter:blur(.2px)}
.cube-inner-glass::after{right:11%;top:29%;width:20%;height:50%;border-radius:18%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(121,205,237,.12) 52%,rgba(74,170,216,.10));box-shadow:inset 0 0 24px rgba(255,255,255,.16)}
.dynamic-water-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none}
.dynamic-water-svg .water-fill rect{animation:waterRise .72s cubic-bezier(.22,.8,.24,1) both}
.dynamic-water-svg .water-surface{animation:surfaceRise .72s cubic-bezier(.22,.8,.24,1) both}
@keyframes waterRise{from{transform:translateY(var(--sy))}to{transform:translateY(var(--ey))}}
@keyframes surfaceRise{from{transform:translateY(var(--sy))}to{transform:translateY(var(--ey))}}
.cube-depth{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;opacity:.12;mix-blend-mode:screen;pointer-events:none;filter:saturate(1.08) blur(.15px)}
.cube-art{z-index:3}
.cube-reflection-art{z-index:0;opacity:.14}
.cube-glass{z-index:4;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 25%,rgba(255,255,255,.025) 52%,rgba(114,201,244,.035) 100%);box-shadow:inset 0 0 38px rgba(255,255,255,.16),inset 0 -18px 25px rgba(89,189,231,.06)}
.cube-reflection{z-index:0}


.data-tools{gap:12px}.data-actions{display:flex;gap:10px;margin-top:4px}.secondary{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.58);color:var(--text);border-radius:14px;padding:12px 14px;font:600 15px system-ui}.theme-dark .secondary{background:rgba(255,255,255,.06)}

/* v0.13 — five animated WebP water levels */
.cube-stage{isolation:isolate;width:min(86vw,360px);height:min(86vw,360px);margin:18px auto 0;display:grid;place-items:center;position:relative;}
.cube-stage::before{content:"";position:absolute;left:2%;right:2%;bottom:8%;height:25%;border-radius:50%;background:radial-gradient(ellipse,rgba(91,196,236,.28),rgba(145,222,245,.13) 45%,transparent 75%);filter:blur(18px);z-index:0;}
.cube-stage::after{content:"";position:absolute;left:7%;right:7%;bottom:4%;height:12%;border-radius:50%;background:rgba(255,255,255,.26);filter:blur(10px);z-index:0;}
.cube{position:relative;width:100%;height:100%;overflow:visible;background:transparent;border:0;box-shadow:none;border-radius:0;display:grid;place-items:center;z-index:1;}
/* v0.14.7 — gently lift the cube without moving the content below */
.cube{top:-18px;}
.cube-level{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;opacity:0;transform:scale(.985);transition:opacity .55s ease,transform .55s cubic-bezier(.22,.8,.24,1);filter:drop-shadow(0 24px 22px rgba(50,120,158,.18)) drop-shadow(0 7px 11px rgba(50,120,158,.08));pointer-events:none;mix-blend-mode:normal;}
.cube[data-level="0"] .level-0,.cube[data-level="1"] .level-25,.cube[data-level="2"] .level-50,.cube[data-level="3"] .level-75,.cube[data-level="4"] .level-100{opacity:1;transform:scale(1);}
.water-shimmer{display:none;}
.water-shimmer::before{content:"";position:absolute;inset:-30% -45%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.52) 48%,rgba(255,255,255,.08) 54%,transparent 68%);animation:shimmer 3.8s ease-in-out infinite;}
.water-shimmer::after{content:"";position:absolute;left:8%;right:4%;top:16%;height:12%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.52),transparent);filter:blur(2px);animation:wave 2.8s ease-in-out infinite;}
@keyframes shimmer{0%,100%{transform:translateX(-22%)}50%{transform:translateX(22%)}}

.cube-reflection{position:absolute;z-index:0;left:8%;right:8%;bottom:-4%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(100,203,239,.25),rgba(115,211,243,.10) 45%,transparent 76%);filter:blur(13px);pointer-events:none;}

<body><div id="app"></div>
<script>
const DB='aqua-cube',KEY='profile',ENTRY='entries';
const defaults={goal:2000,volume:250,theme:'system',customVolumes:[150,250,350,500],dayStart:'07:00',dayEnd:'23:00',planStep:120,tools:{converterValue:500,converterFrom:'ml',distributionPlan:[],goalWeight:''}};
function toolState(){profile.tools={...defaults.tools,...(profile.tools||{})};return profile.tools}
function toolBackHeader(){return `<button class="top-back" id="tools-back" aria-label="Назад" title="Назад">${ICON.back}</button>`}
function settingsBackHeader(){return `<button class="top-back" id="settings-back" aria-label="Назад" title="Назад">${ICON.back}</button>`}
let profile={...defaults},entries=[],allEntries=[],tab='today',selectedHistoryDate=null,toolView=null,lastWaterP=null;
const presets=[100,150,200,250,330,500];
const $=s=>document.querySelector(s);
const ml=n=>new Intl.NumberFormat('ru-RU').format(n);
function todayKey(){return new Date().toISOString().slice(0,10)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(KEY))d.createObjectStore(KEY,{keyPath:'id'});if(!d.objectStoreNames.contains(ENTRY))d.createObjectStore(ENTRY,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){let d=await openDB();let p=await new Promise((res,rej)=>{let r=d.transaction(KEY).objectStore(KEY).get('default');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});profile=p?{...defaults,...p}:profile;profile.theme='system';toolState();allEntries=await new Promise((res,rej)=>{let r=d.transaction(ENTRY).objectStore(ENTRY).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});entries=allEntries.filter(x=>x.date.slice(0,10)===todayKey());applyTheme()}
async function saveProfile(){let d=await openDB();return new Promise((res,rej)=>{let t=d.transaction(KEY,'readwrite');t.objectStore(KEY).put({id:'default',...profile});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function addWater(n){let d=await openDB();let e={id:(crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)),amount:n,date:new Date().toISOString()};await new Promise((res,rej)=>{let t=d.transaction(ENTRY,'readwrite');t.objectStore(ENTRY).add(e);t.oncomplete=res;t.onerror=()=>rej(t.error)});entries.push(e);allEntries.push(e);render()}
function applyTheme(){let t=profile.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):profile.theme;document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0E1418':'#F7FAFC'}

function dateKey(date){return date.toISOString().slice(0,10)}
function localDateFromKey(key){
  const [y,m,d]=key.split('-').map(Number);
  return new Date(y,m-1,d);
}
function lastSevenDays(){
  const now=new Date(),days=[];
  now.setHours(12,0,0,0);
  for(let i=6;i>=0;i--){
    const d=new Date(now);
    d.setDate(now.getDate()-i);
    days.push(d);
  }
  return days;
}
function dayEntries(key){
  return allEntries.filter(e=>e.date.slice(0,10)===key).sort((a,b)=>a.date.localeCompare(b.date));
}
function dayTotal(key){return dayEntries(key).reduce((s,e)=>s+e.amount,0)}
function shortDay(d){return new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(d).replace('.','')}
function fullDay(d){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(d)}
function timeOf(iso){return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function historyView(){
  const days=lastSevenDays();
  const data=days.map(d=>({date:d,key:dateKey(d),total:dayTotal(dateKey(d))}));
  const avg=Math.round(data.reduce((s,x)=>s+x.total,0)/7);
  const avgPct=Math.round(avg/Math.max(profile.goal,1)*100);
  const reached=data.filter(x=>x.total>=profile.goal).length;
  const max=Math.max(profile.goal,...data.map(x=>x.total),1);
  const selected=selectedHistoryDate ? data.find(x=>x.key===selectedHistoryDate) : null;

  const detail=selected ? `
    <div class="detail card">
      <div class="detail-head">
        <div><b>${fullDay(selected.date)}</b><span>${ml(selected.total)} мл из ${ml(profile.goal)} мл</span></div>
        <button class="close-detail" id="close-detail" aria-label="Закрыть">×</button>
      </div>
      <div class="detail-progress"><div style="width:${Math.min(selected.total/Math.max(profile.goal,1),1)*100}%"></div></div>
      <div class="entry-list">
        ${dayEntries(selected.key).length ? dayEntries(selected.key).map(e=>`<div class="entry-row"><span>${timeOf(e.date)}</span><strong>${ml(e.amount)} мл</strong></div>`).join('') : `<div class="empty">В этот день записей нет.</div>`}
      </div>
    </div>` : '';

  return `
    <section class="screen">
      <div class="eyebrow">AQUA CUBE</div>
      <h1>История</h1>
      <p class="date">Последние 7 дней</p>

      <div class="stats-grid">
        <div class="stat-card"><span>Среднее</span><strong>${ml(avg)} мл</strong><small>в день</small></div>
        <div class="stat-card"><span>Средняя цель</span><strong>${avgPct}%</strong><small>от цели</small></div>
      </div>

      <div class="card chart-card">
        <div class="section-title"><b>Последние 7 дней</b><span>${reached} из 7 дней</span></div>
        <div class="chart">
          ${data.map(x=>{
            const height=Math.max(5,Math.round(x.total/max*100));
            const isToday=x.key===todayKey();
            const pct=Math.round(x.total/Math.max(profile.goal,1)*100);
            return `<button class="bar-wrap ${isToday?'today-bar':''} ${x.key===selectedHistoryDate?'chosen':''}" data-history-date="${x.key}">
              <span class="bar-value">${pct}%</span>
              <span class="bar-track"><i style="height:${height}%"></i></span>
              <span class="bar-day">${shortDay(x.date)}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="goal-caption"><span>Цель: ${ml(profile.goal)} мл</span><span>${reached} из 7 дней — цель достигнута</span></div>
      </div>

      ${detail}

      <div class="day-list">
        ${data.slice().reverse().map(x=>`
          <button class="day-row ${x.key===todayKey()?'today-row':''}" data-history-date="${x.key}">
            <span class="day-info"><b>${x.key===todayKey()?'Сегодня':fullDay(x.date)}</b><small>${x.total>=profile.goal?'Цель достигнута':`Осталось ${ml(Math.max(profile.goal-x.total,0))} мл`}</small></span>
            <strong>${ml(x.total)} мл</strong><span class="chevron">›</span>
          </button>`).join('')}
      </div>

      <nav class="nav"><button data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button class="active" data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav>
    </section>`;

function toolsView(){
  const tools = [
    ['DROP','Рассчитать цель','Ориентир по весу.','goal-calculator'], ['CONVERT','Конвертер','мл, л, oz и стаканы.','converter'], ['CLOCK','Распределить воду','Спокойный план на день.','distribution'], ['BOOK','Знания','Проверенные материалы.','knowledge'], ['BOTTLE','Мои объёмы','Собственные бутылки и стаканы.','volumes']
  ];
  return `
    <section class="screen">
      <div class="eyebrow">AQUA CUBE</div>
      <h1>Инструменты</h1>
      <p class="tool-intro">Небольшие инструменты, которые помогают настроить Aqua Cube под тебя.</p>
      <div class="list">
        ${tools.map(t=>`
          <button class="tool-card" data-tool="${t[3]}">
            <div class="tool-icon">${({'DROP':ICON.drop,'CONVERT':ICON.convert,'CLOCK':ICON.clock,'BOOK':ICON.book,'BOTTLE':ICON.bottle}[t[0]])}</div>
            <b>${t[1]}</b>
            <span>${t[2]}</span>
          </button>`).join('')}
      </div>
      <nav class="nav"><button data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button class="active" data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav>
    </section>`;
}

function converterCalc(){const v=Number($('#conv-value')?.value)||0,from=$('#conv-from')?.value||'ml';const x={ml:v,l:v*1000,oz:v*29.5735295625,cup:v*250}[from];$('#conv-result').innerHTML=`<small>Эквивалент</small><strong>${ml(x)} мл</strong><span>${(x/1000).toFixed(2)} л · ${(x/29.5735295625).toFixed(1)} oz · ${(x/250).toFixed(1)} стакана</span>`}
function renderSavedPlan(items){if(!Array.isArray(items)||!items.length)return '';return `<div class="card plan-card"><div class="section-title"><b>План на день</b><span>${ml(profile.goal)} мл</span></div>${items.map(x=>`<div class="plan-row"><span>${x.time}</span><strong>${ml(x.amount)} мл</strong></div>`).join('')}</div>`}
function distributionView(){const t=toolState();return `<section class="screen tool-screen secondary-screen"><button class="top-back" id="tools-back" aria-label="Назад" title="Назад">${ICON.back}</button><div class="secondary-header"><div class="eyebrow">AQUA CUBE</div></div><h1>Распределить воду</h1><p class="tool-intro">Составим спокойный план на день на основе твоей цели.</p><div class="card form-card"><label>Начало дня<input id="plan-start" type="time" value="${profile.dayStart||'07:00'}"></label><label>Конец дня<input id="plan-end" type="time" value="${profile.dayEnd||'23:00'}"></label><label>Шаг между приёмами<select id="plan-step"><option value="90" ${Number(profile.planStep||120)===90?'selected':''}>90 минут</option><option value="120" ${Number(profile.planStep||120)===120?'selected':''}>120 минут</option><option value="150" ${Number(profile.planStep||120)===150?'selected':''}>150 минут</option><option value="180" ${Number(profile.planStep||120)===180?'selected':''}>180 минут</option></select></label><button class="primary full" id="make-plan">Составить план</button></div><div id="plan-result">${renderSavedPlan(t.distributionPlan)}</div>${toolBackButton()}</section>`}
async function makePlan(){const s=$('#plan-start').value,e=$('#plan-end').value,step=Number($('#plan-step').value);if(!s||!e){alert('Укажи начало и конец дня.');return}let [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number),start=sh*60+sm,end=eh*60+em;if(end<=start)end+=1440;const times=[];for(let t=start;t<=end;t+=step)times.push(t);const count=Math.max(1,times.length),base=Math.round(profile.goal/count/50)*50,total=base*count,diff=profile.goal-total;const items=times.map((t,i)=>({time:`${String(Math.floor((t%1440)/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`,amount:base+(i===times.length-1?diff:0)}));profile.dayStart=s;profile.dayEnd=e;profile.planStep=step;toolState().distributionPlan=items;await saveProfile();$('#plan-result').innerHTML=`<div class="card plan-card"><div class="section-title"><b>План на день</b><span>${ml(profile.goal)} мл</span></div>${items.map(x=>`<div class="plan-row"><span>${x.time}</span><strong>${ml(x.amount)} мл</strong></div>`).join('')}</div>`}
function volumesView(){const vals=Array.isArray(profile.customVolumes)&&profile.customVolumes.length?profile.customVolumes:[150,250,350,500];return `<section class="screen tool-screen secondary-screen"><button class="top-back" id="tools-back" aria-label="Назад" title="Назад">${ICON.back}</button><div class="secondary-header"><div class="eyebrow">AQUA CUBE</div></div><h1>Мои объёмы</h1><p class="tool-intro">Создай свои быстрые объёмы для добавления воды.</p><div class="card form-card"><label>Новый объём, мл<input id="new-volume" type="number" inputmode="numeric" min="1" max="5000" step="1" placeholder="Например, 450"></label><button class="primary full" id="add-volume">Добавить объём</button></div><div class="card volume-list">${vals.map(v=>`<div class="volume-row"><strong>${ml(v)} мл</strong><button class="secondary" data-remove-volume="${v}">Удалить</button></div>`).join('')}</div>${toolBackButton()}</section>`}
async function addCustomVolume(){const v=Math.round(Number($('#new-volume').value));if(!v||v<1||v>5000){alert('Введите объём от 1 до 5000 мл.');return}profile.customVolumes=Array.isArray(profile.customVolumes)?profile.customVolumes:[];if(!profile.customVolumes.includes(v))profile.customVolumes.push(v);profile.customVolumes.sort((a,b)=>a-b);profile.volume=v;await saveProfile();render()}
async function removeCustomVolume(v){profile.customVolumes=(Array.isArray(profile.customVolumes)?profile.customVolumes:[]).filter(x=>x!==v);await saveProfile();render()}
function knowledgeView(){const cards=[['Сколько воды нужно?','Дневная потребность зависит от веса, активности, температуры и питания. Цель Aqua Cube — ориентир, который можно изменить вручную.'],['Пей регулярно','Равномерное распределение воды в течение дня обычно удобнее, чем попытка восполнить весь объём вечером.'],['Учитывай активность','Во время тренировок и при жаркой погоде потребность в жидкости может возрастать.'],['Слушай сигналы организма','Жажда — один из естественных сигналов потребности в жидкости.'],['Вода и питание','Часть жидкости поступает с едой и другими напитками. Aqua Cube учитывает объём воды, который ты добавляешь в приложение.']];return `<section class="screen tool-screen secondary-screen"><button class="top-back" id="tools-back" aria-label="Назад" title="Назад">${ICON.back}</button><div class="secondary-header"><div class="eyebrow">AQUA CUBE</div></div><h1>Знания</h1><p class="tool-intro">Короткие материалы, которые помогают лучше понимать привычку пить воду.</p><div class="knowledge-list">${cards.map((c,i)=>`<article class="card knowledge-card"><span>0${i+1}</span><div><b>${c[0]}</b><p>${c[1]}</p></div></article>`).join('')}</div><p class="note">Материалы носят информационный характер и не заменяют индивидуальные медицинские рекомендации.</p>${toolBackButton()}</section>`}
function renderGoalResult(value){
  const result=$('#goal-result');
  if(!result) return;
  if(!value){result.innerHTML='';return}
  result.innerHTML=`
    <div class="card calc-result">
      <small>Ориентировочная цель</small>
      <strong>${ml(value)} мл</strong>
      <small>в день</small>
      <button class="primary full" id="save-calculated-goal" style="margin-top:16px">Сохранить как цель</button>
    </div>`;
  $('#save-calculated-goal').onclick=async()=>{
    profile.goal=value;
    await saveProfile();
    tab='today';
    toolView=null;
    render();
  };
}

function render(){let total=entries.reduce((s,e)=>s+e.amount,0),pct=Math.round(total/Math.max(profile.goal,1)*100),p=Math.min(total/Math.max(profile.goal,1),1)*100,waterStartP=lastWaterP===null?p:lastWaterP,waterStartY=Math.round(610-(610-275)*waterStartP),waterEndY=Math.round(610-(610-275)*Math.min(p,1));lastWaterP=p;let date=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let body='';
if(tab==='today')body=`<section class="screen"><div class="top"><div><div class="eyebrow">AQUA CUBE</div><h1>Сегодня</h1><p class="date">${date}</p></div><button class="gear-button" id="settings" aria-label="Настройки" title="Настройки">${ICON.gear}</button></div><main class="today"><div class="cube-stage"><div class="cube" data-level="${Math.min(4,Math.round(p/25))}" aria-label="Уровень воды ${Math.round(p)} процентов"><img class="cube-level level-0" src="cube-level-0-final.png" alt="" aria-hidden="true"><img class="cube-level level-25" src="cube-level-25-final.png" alt="" aria-hidden="true"><img class="cube-level level-50" src="cube-level-50-final.png" alt="" aria-hidden="true"><img class="cube-level level-75" src="cube-level-75-final.png" alt="" aria-hidden="true"><img class="cube-level level-100" src="cube-level-100-final.png" alt="" aria-hidden="true"><div class="water-shimmer" aria-hidden="true"></div><div class="cube-glass" aria-hidden="true"></div><div class="cube-reflection" aria-hidden="true"></div></div></div><div class="summary"><strong>${ml(total)} мл</strong><span>из ${ml(profile.goal)} мл</span><small>${total<profile.goal?'Осталось '+ml(profile.goal-total)+' мл':'Цель достигнута'}</small></div><div class="add"><button class="primary" id="add">+ ${ml(profile.volume)} мл</button><button class="toggle" id="toggle">⌄</button><div class="menu hidden" id="menu">${presets.map(v=>`<button class="${v===profile.volume?'selected':''}" data-v="${v}">${v} мл</button>`).join('')}<button class="other" id="other">Другой объём</button></div></div><div class="timeline" style="--progress:${Math.min(p,100)}%"><div class="line"></div><div class="dot" aria-hidden="true"></div><div class="labels"><span>Сегодня</span><span>${pct}%</span></div></div></main><nav class="nav"><button class="active" data-tab="today"><span class="nav-icon">${ICON.today}</span><span>Сегодня</span></button><button data-tab="history"><span class="nav-icon">${ICON.history}</span><span>История</span></button><button data-tab="tools"><span class="nav-icon">${ICON.tools}</span><span>Инструменты</span></button></nav></section>`;
else if(tab==='history')body=historyView();
else if(tab==='tools')body=toolView==='goal-calculator'?goalCalculatorView():
toolView==='converter'?converterView():
toolView==='distribution'?distributionView():
toolView==='volumes'?volumesView():
toolView==='knowledge'?knowledgeView():toolsView();
else body=`<section class="screen secondary-screen"><button class="top-back" id="settings-back" aria-label="Назад" title="Назад">${ICON.back}</button><div class="secondary-header"><div class="eyebrow">AQUA CUBE</div></div><h1>Настройки</h1><div class="card settings"><label>Дневная цель<input id="goal" type="number" min="250" max="10000" step="50" value="${profile.goal}"></label><label>Объём по умолчанию<select id="volume">${presets.map(v=>`<option value="${v}" ${v===profile.volume?'selected':''}>${v} мл</option>`).join('')}</select></label><label>Режим<select id="theme"><option value="system" selected>Системный</option></select></label><button class="primary full" id="save">Сохранить</button></div><div class="card data-tools"><b>Данные</b><span>Safari и версия на экране «Домой» могут иметь отдельное локальное хранилище. Здесь можно безопасно перенести данные между ними.</span><div class="data-actions"><button class="secondary" id="exportData">Экспорт</button><button class="secondary" id="importData">Импорт</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="card"><b>Aqua Cube</b><span>Локальное приложение без аккаунта и Apple Health.</span></div></section>`;
$('#app').innerHTML=body;bind()}
async function exportData(){
  const payload={version:1,app:'Aqua Cube',exportedAt:new Date().toISOString(),profile,entries:allEntries};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const file=new File([blob],`aqua-cube-backup-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title:'Aqua Cube — данные',files:[file]});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importData(file){
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.app!=='Aqua Cube' || !Array.isArray(data.entries) || !data.profile) throw new Error('invalid');
    const cleanEntries=data.entries.filter(e=>e && typeof e.id==='string' && Number.isFinite(Number(e.amount)) && e.date).map(e=>({...e,amount:Number(e.amount)}));
    const cleanProfile={...defaults,...data.profile};
    if(!Number.isFinite(cleanProfile.goal)||cleanProfile.goal<250) cleanProfile.goal=2000;
    if(!Number.isFinite(cleanProfile.volume)||cleanProfile.volume<1||cleanProfile.volume>5000) cleanProfile.volume=250;
    const d=await openDB();
    await new Promise((res,rej)=>{const t=d.transaction([KEY,ENTRY],'readwrite');const ps=t.objectStore(KEY),es=t.objectStore(ENTRY);ps.put({id:'default',...cleanProfile});es.clear();for(const e of cleanEntries)es.put(e);t.oncomplete=res;t.onerror=()=>rej(t.error)});
    profile=cleanProfile;toolState();allEntries=cleanEntries;entries=allEntries.filter(x=>x.date.slice(0,10)===todayKey());lastWaterP=null;applyTheme();render();alert('Данные Aqua Cube импортированы.');
  }catch(e){alert('Не удалось импортировать файл Aqua Cube.');}
}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedHistoryDate=null;toolView=null;render()});document.querySelectorAll('[data-history-date]').forEach(b=>b.onclick=()=>{selectedHistoryDate=b.dataset.historyDate;render()});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{toolView=b.dataset.tool;render()});
$('#conv-value')?.addEventListener('input',()=>{toolState().converterValue=Number($('#conv-value').value)||0;saveProfile();converterCalc()});
$('#conv-from')?.addEventListener('change',()=>{toolState().converterFrom=$('#conv-from').value;saveProfile();converterCalc()});
$('#plan-start')?.addEventListener('change',async()=>{profile.dayStart=$('#plan-start').value;await saveProfile()});
$('#plan-end')?.addEventListener('change',async()=>{profile.dayEnd=$('#plan-end').value;await saveProfile()});
$('#plan-step')?.addEventListener('change',async()=>{profile.planStep=Number($('#plan-step').value);await saveProfile()});
$('#make-plan')?.addEventListener('click',makePlan);
$('#add-volume')?.addEventListener('click',addCustomVolume);
document.querySelectorAll('[data-remove-volume]').forEach(b=>b.onclick=()=>removeCustomVolume(Number(b.dataset.removeVolume)));
setTimeout(()=>{if(toolView==='converter')converterCalc()},0);
$('#weight')?.addEventListener('input',()=>{toolState().goalWeight=$('#weight').value;saveProfile()});
$('#calculate-goal')?.addEventListener('click',()=>{
  const weight=Number($('#weight').value);
  toolState().goalWeight=$('#weight').value; saveProfile();
  if(!weight || weight<1 || weight>300){ alert('Введите вес от 1 до 300 кг.'); return; }
  const calculated=Math.round((weight*30)/50)*50;
  renderGoalResult(calculated);
});
$('#tools-back')?.addEventListener('click',()=>{toolView=null;render()});
$('#settings-back')?.addEventListener('click',()=>{tab='today';render()});
$('#close-detail')?.addEventListener('click',()=>{selectedHistoryDate=null;render()});$('#settings')?.addEventListener('click',()=>{tab='settings';render()});$('#toggle')?.addEventListener('click',()=>$('#menu').classList.toggle('hidden'));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{profile.volume=+b.dataset.v;await saveProfile();render()});$('#add')?.addEventListener('click',()=>addWater(profile.volume));$('#other')?.addEventListener('click',async()=>{let v=Number(prompt('Введите объём в мл (1–5000):'));if(v>=1&&v<=5000){profile.volume=v;await saveProfile();render()}});$('#save')?.addEventListener('click',async()=>{profile.goal=Number($('#goal').value)||2000;profile.volume=Number($('#volume').value)||250;profile.theme='system';await saveProfile();applyTheme();tab='today';render()});$('#exportData')?.addEventListener('click',exportData);$('#importData')?.addEventListener('click',()=>$('#importFile').click());$('#importFile')?.addEventListener('change',e=>importData(e.target.files[0]))}
async function boot(){
  try { await load(); }
  catch (error) {
    console.error('Aqua Cube storage error:', error);
    // The UI must still work if IndexedDB is temporarily unavailable.
    profile = {...defaults};
    entries = [];
    applyTheme();
  }
  render();
}
boot();

// The Service Worker uses network-first navigation and versioned cache cleanup.
(async()=>{

    await reg.update();
  }catch(e){console.warn('Aqua Cube PWA update:',e)}
})();
