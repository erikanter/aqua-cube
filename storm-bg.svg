<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2000" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020b1d"/>
    <stop offset="0.42" stop-color="#061b3b"/>
    <stop offset="0.72" stop-color="#082653"/>
    <stop offset="1" stop-color="#020b1d"/>
  </linearGradient>
  <radialGradient id="cloud1" cx="50%" cy="20%" r="65%">
    <stop offset="0" stop-color="#1b5a91" stop-opacity=".42"/>
    <stop offset=".5" stop-color="#0d315c" stop-opacity=".25"/>
    <stop offset="1" stop-color="#06162f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cloud2" cx="30%" cy="70%" r="70%">
    <stop offset="0" stop-color="#0d4d82" stop-opacity=".34"/>
    <stop offset="1" stop-color="#03132d" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1000" height="2000" fill="url(#bg)"/>
<rect width="1000" height="2000" fill="url(#cloud1)"/>
<rect width="1000" height="2000" fill="url(#cloud2)"/>
<g opacity=".18" filter="url(#soft)" fill="#6fb8ee">
  <ellipse cx="180" cy="430" rx="300" ry="120"/>
  <ellipse cx="810" cy="820" rx="340" ry="150"/>
  <ellipse cx="270" cy="1390" rx="350" ry="150"/>
  <ellipse cx="820" cy="1700" rx="300" ry="130"/>
</g>
<!-- lightning glow -->
<g fill="none" stroke="#dff7ff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".8">
  <path d="M300 0 L348 170 L305 270 L390 405 L335 515 L430 640 L385 760" stroke-width="7"/>
  <path d="M710 200 L665 350 L720 440 L625 565 L680 690 L570 835 L620 965" stroke-width="5"/>
  <path d="M120 760 L185 860 L140 980 L230 1080 L175 1210 L270 1320" stroke-width="4"/>
</g>
<!-- crisp cores -->
<g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
  <path d="M300 0 L348 170 L305 270 L390 405 L335 515 L430 640 L385 760" stroke-width="2.2"/>
  <path d="M348 170 L250 235 M305 270 L225 315 M390 405 L470 450 M335 515 L250 570 M430 640 L510 700" stroke-width="1.5" opacity=".9"/>
  <path d="M710 200 L665 350 L720 440 L625 565 L680 690 L570 835 L620 965" stroke-width="1.9"/>
  <path d="M665 350 L585 390 M720 440 L790 485 M625 565 L540 615 M680 690 L755 735 M570 835 L490 885" stroke-width="1.2" opacity=".85"/>
  <path d="M120 760 L185 860 L140 980 L230 1080 L175 1210 L270 1320" stroke-width="1.6"/>
</g>
<!-- distant horizon shimmer -->
<path d="M0 1540 C180 1490 300 1570 500 1525 C700 1480 820 1570 1000 1515 L1000 2000 L0 2000 Z" fill="#0a3d6d" opacity=".18"/>
</svg>
